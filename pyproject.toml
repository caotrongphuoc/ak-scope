[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ak-scope"
version = "0.1.0"
description = "Record, visualize and verify task messages, signals and timers in AK event-driven firmware"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
akscope = "akscope.cli:main"

[tool.setuptools.packages.find]
include = ["akscope*"]
